[project]
name = "novel"
version = "0.1.0"
description = "抓取小说生成ePub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "tqdm>=4.70.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
